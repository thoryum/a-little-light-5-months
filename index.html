<style>
:root{--gold:#ffe9a8;--ink:#0e1236;--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
body{height:100vh;height:100dvh;position:fixed;inset:0;width:100%}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(20px + var(--sa-t)) 20px calc(20px + var(--sa-b));transition:opacity 1.2s ease;opacity:0;pointer-events:none}
h1{font:600 clamp(34px,10vw,70px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:.06em;margin:0 0 14px;text-shadow:0 0 28px rgba(255,226,150,.8),0 2px 10px rgba(30,40,100,.6)}
.sub{font:italic clamp(16px,4.4vw,22px) Georgia,serif;margin:0 0 34px;text-shadow:0 1px 8px rgba(20,30,90,.8)}
.btn{font:600 clamp(16px,4.6vw,20px) system-ui,sans-serif;letter-spacing:.08em;color:var(--ink);background:linear-gradient(180deg,#fff7dc,#ffd98a);border:0;border-radius:999px;padding:16px 34px;min-height:54px;box-shadow:0 0 26px rgba(255,214,130,.7);cursor:pointer;transition:transform .15s,box-shadow .15s;touch-action:manipulation}
.btn:active{transform:scale(.94);box-shadow:0 0 40px rgba(255,230,160,1)}
#menu .btn{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 44px rgba(255,226,150,1)}}
body[data-s=MENU] #menu,#err.on{opacity:1;pointer-events:auto}
#menu h1,#menu .sub,#menu .btn{opacity:0;transform:translateY(10px);animation:in 1.4s .2s forwards}
#menu .sub{animation-delay:.7s}#menu .btn{animation:in 1.2s 1.3s forwards,pulse 2.6s 2.5s ease-in-out infinite}
@keyframes in{to{opacity:1;transform:none}}
#err{background:rgba(11,16,48,.94);z-index:30;gap:18px;font-size:18px}
#joy{position:fixed;left:calc(22px + var(--sa-l));bottom:calc(26px + var(--sa-b));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none;z-index:5;opacity:0;pointer-events:none;transition:opacity .6s}

#cam{position:fixed;right:0;top:0;width:58%;height:100%;touch-action:none;z-index:2;pointer-events:none}

#hint{position:fixed;top:calc(64px + var(--sa-t));left:0;right:0;text-align:center;font:italic clamp(16px,4.4vw,22px) Georgia,serif;text-shadow:0 1px 10px rgba(20,40,110,.9);opacity:0;transition:opacity 1.5s;pointer-events:none;z-index:4}
body[data-s=EXPLORATION] #hint:not(.off){opacity:1}
#act{position:fixed;right:calc(22px + var(--sa-r));bottom:calc(40px + var(--sa-b));z-index:6;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .4s,transform .4s;padding:20px 28px;font-size:20px}
#act.show{opacity:1;transform:none;pointer-events:auto;animation:pulse 1.6s infinite}
.sm{position:fixed;top:calc(14px + var(--sa-t));z-index:8;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;min-width:46px;height:46px;padding:0 16px;font:600 14px system-ui;letter-spacing:.08em;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer;touch-action:manipulation}
#snd{right:calc(14px + var(--sa-r));font-size:20px;padding:0}
#skip{left:calc(14px + var(--sa-l));opacity:0;pointer-events:none;transition:opacity .5s}
body[data-s=CUTSCENE] #skip{opacity:1;pointer-events:auto}
#msg{position:fixed;left:0;right:0;bottom:calc(92px + var(--sa-b));padding:0 18px;text-align:center;z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:10px;align-items:center}
#msg div{font:600 clamp(20px,6vw,38px)/1.2 Georgia,"Times New Roman",serif;color:#fff8e0;text-shadow:0 0 18px rgba(255,210,120,.9),0 2px 12px rgba(5,5,40,.95);opacity:0;transform:translateY(14px) scale(.96);transition:opacity 1.6s ease,transform 1.6s ease;background:rgba(10,8,40,.28);border-radius:18px;padding:6px 16px}
#msg div.show{opacity:1;transform:none}
#m2{font-size:clamp(26px,8vw,50px)!important;color:#ffd4ec!important}

@media (prefers-reduced-motion:reduce){#menu .btn,#act.show{animation:none}#msg div{transition-duration:.3s}}
</style>

<canvas id="c"></canvas>
<div id="menu" class="ov"><h1>A LITTLE LIGHT</h1><p class="sub">Uma pequena aventura espera por você...</p><button class="btn" id="start">COMEÇAR ❤️</button></div>

<script>
window.showErr=function(m){var e=document.getElementById('err');document.getElementById('errt').textContent=m||'Não foi possível carregar a experiência. Verifique sua conexão.';e.classList.add('on')};
window.addEventListener('contextmenu',function(e){e.preventDefault()});
setTimeout(function(){if(!window.__ready)showErr()},12000);

<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&innerWidth<900);
let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rr=(a,b)=>a+(b-a)*rnd();

/* ---------- renderer ---------- */
let renderer,ctxLost=false;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'})}catch(e){showErr('Seu navegador não conseguiu iniciar o modo 3D.');throw e}
let pr=Math.min(devicePixelRatio||1,mobile?1.5:2);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xdff2ff,45,170);
const camera=new THREE.PerspectiveCamera(60,1,.1,500);
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(pr);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
$('c').addEventListener('webglcontextlost',e=>{e.preventDefault();ctxLost=true;showErr('A imagem 3D foi interrompida pelo aparelho.')});
$('c').addEventListener('webglcontextrestored',()=>{ctxLost=false;$('err').classList.remove('on')});

/* ---------- textures ---------- */
function mkTex(draw,s=64){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const glowTex=mkTex((g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.6)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const starTex=mkTex((g,s)=>{g.drawImage(glowTex.image,0,0);for(const v of[0,1]){const l=v?g.createLinearGradient(s/2,0,s/2,s):g.createLinearGradient(0,s/2,s,s/2);l.addColorStop(0,'rgba(255,255,255,0)');l.addColorStop(.5,'rgba(255,255,255,1)');l.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=l;v?g.fillRect(s/2-1.5,0,3,s):g.fillRect(0,s/2-1.5,s,3)}},128);

/* ---------- sky ---------- */
const skyU={top:{value:new THREE.Color()},bot:{value:new THREE.Color()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,16,12),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
vertexShader:'varying float vY;void main(){vY=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 top;uniform vec3 bot;varying float vY;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(-.05,.75,vY)),1.);#include <colorspace_fragment>\n}'}));
sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);
const SK=[[0x5fb0ff,0xe4f4ff],[0x2a3a9a,0x7f93e6],[0x3a1f78,0x8a56b8],[0x070b25,0x2a2060]].map(a=>a.map(h=>new THREE.Color(h)));
const tmpA=new THREE.Color(),tmpB=new THREE.Color();
function skyAt(k){const s=clamp(k)*3,i=Math.min(2,Math.floor(s)),f=sm(s-i);skyU.top.value.copy(SK[i][0]).lerp(SK[i+1][0],f);skyU.bot.value.copy(SK[i][1]).lerp(SK[i+1][1],f);scene.fog.color.copy(skyU.bot.value)}
const bgStars=(()=>{const n=220,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=rr(0,6.283),v=rr(.08,1),r=Math.sqrt(1-v*v);p[i*3]=Math.cos(u)*r*280;p[i*3+1]=v*280;p[i*3+2]=Math.sin(u)*r*280}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.Points(g,new THREE.PointsMaterial({size:3,map:glowTex,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));m.frustumCulled=false;scene.add(m);return m})();

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xe4f3ff,0x7fae66,1.5);scene.add(hemi);
const dir=new THREE.DirectionalLight(0xfff0cc,2);dir.position.set(10,20,8);scene.add(dir);
const altarLight=new THREE.PointLight(0xffc860,0,40,1.6);altarLight.position.set(0,1.8,-9);scene.add(altarLight);

/* ---------- island ---------- */
const L=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const cols=[];
const island=new THREE.Group();scene.add(island);
const top=new THREE.Mesh(new THREE.CylinderGeometry(13.5,13,1,40),[L(0x9a7a55),L(0x82d36e),L(0x6b5a48)]);top.position.y=-.5;island.add(top);
const under=new THREE.Mesh(new THREE.ConeGeometry(13,11,20),new THREE.MeshLambertMaterial({color:0x7a7389,flatShading:true}));under.rotation.x=Math.PI;under.position.y=-6.5;island.add(under);
const du=new THREE.Object3D();
function inst(geo,mat,n,place){const m=new THREE.InstancedMesh(geo,mat,n);const c=new THREE.Color();for(let i=0;i<n;i++){const col=place(du,i);du.updateMatrix();m.setMatrixAt(i,du.matrix);if(col!==undefined){c.set(col);m.setColorAt(i,c)}}m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;island.add(m);return m}
function ringPos(rmin,rmax,avoid){for(let k=0;k<40;k++){const a=rr(0,6.283),r=rr(rmin,rmax),x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z+9)>3.2&&(!avoid||Math.hypot(x-pathX(z),0)>1.1||z>8||z<-7))return[x,z]}return[11,0]}
function pathX(z){return 2.2*Math.sin(z*.38)}
const fPal=[0xff9ec4,0xffffff,0xffe27a,0xc7a8ff,0xff8f8f];
inst(new THREE.SphereGeometry(1,6,5),L(0xffffff),150,(d,i)=>{const[x,z]=ringPos(1,12.2,true);d.position.set(x,.16,z);d.scale.setScalar(rr(.1,.2));d.rotation.set(0,0,0);return fPal[i%5]});
inst(new THREE.ConeGeometry(.12,.5,4),L(0xffffff),260,(d,i)=>{const[x,z]=ringPos(0,12.6,false);d.position.set(x,.2,z);d.scale.set(1,rr(.7,1.5),1);d.rotation.set(rr(-.2,.2),rr(0,6),rr(-.2,.2));return[0x5fbf5a,0x7fd16c,0x4aa65a][i%3]});
const treePos=[[-8,2],[8.5,0],[-9.5,-4],[7,-6],[-5,-11],[3,-11.2],[-10,6],[9.5,6],[0,-12.2]];
const trunkM=L(0x8a6248),leafA=L(0x62c97f),leafB=L(0xf2a6c8);
treePos.forEach(([x,z],i)=>{const g=new THREE.Group(),h=rr(1.4,2.2);const t=new THREE.Mesh(new THREE.CylinderGeometry(.15,.25,h,6),trunkM);t.position.y=h/2;g.add(t);
const f=new THREE.Mesh(new THREE.IcosahedronGeometry(rr(.9,1.25),1),i%3===0?leafB:leafA);f.position.y=h+.5;f.scale.y=.85;g.add(f);const f2=new THREE.Mesh(new THREE.IcosahedronGeometry(.7,0),i%3===0?leafB:leafA);f2.position.set(.5,h+.1,.2);g.add(f2);g.position.set(x,0,z);island.add(g);cols.push([x,z,.55])});
const rockM=new THREE.MeshLambertMaterial({color:0x9a98ad,flatShading:true});
[[-4,3,1],[5,4,.8],[-6.5,-7,1.1],[6.5,-9,.9],[2.5,10,.6],[-3,-2,.5]].forEach(([x,z,s])=>{const r=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rockM);r.position.set(x,s*.4,z);r.scale.y=.7;r.rotation.set(rr(0,3),rr(0,3),0);island.add(r);cols.push([x,z,s*.8])});
[[-7,8,2.2],[8,-3,1.8],[-8,-9,2]].forEach(([x,z,s])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(s,12,6,0,6.283,0,1.57),L(0x74c964));m.scale.y=.3;m.position.set(x,0,z);island.add(m)});
const pebbles=[];for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(rr(.5,1.3),0),rockM);const a=i*1.05+.3;m.userData={a,r:rr(14,19),y:rr(-12,-3),s:rr(.2,.4)};scene.add(m);pebbles.push(m)}

/* path */
const pathMat=new THREE.MeshBasicMaterial({color:0xfff1b0}),stoneM=L(0xece3c8);
const pathLights=[];
for(let i=0;i<10;i++){const z=7-i*1.55,x=pathX(z);const s=new THREE.Mesh(new THREE.CylinderGeometry(.5,.55,.05,10),stoneM);s.position.set(x,.03,z);island.add(s);
const l=new THREE.Mesh(new THREE.SphereGeometry(.11,8,6),pathMat);l.position.set(x+(i%2?.7:-.7),.5,z);island.add(l);pathLights.push(l)}

/* altar */
const stone=L(0xaeb0c6),gold=new THREE.MeshStandardMaterial({color:0xe8c066,metalness:.7,roughness:.35,emissive:0x553a05,emissiveIntensity:.5});
const altar=new THREE.Group();altar.position.set(0,0,-9);island.add(altar);cols.push([0,-9,1.9]);
const add=(g,m,y,x=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);altar.add(o);return o};
add(new THREE.CylinderGeometry(1.9,2.1,.35,8),stone,.17);add(new THREE.CylinderGeometry(1.4,1.55,.3,8),stone,.5);
add(new THREE.CylinderGeometry(.3,.45,.9,8),stone,1.1);
for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4,x=Math.cos(a)*1.25,z=Math.sin(a)*1.25;add(new THREE.BoxGeometry(.28,1.9,.28),stone,1.5,x,z);add(new THREE.BoxGeometry(.38,.12,.38),gold,2.5,x,z)}
for(let i=0;i<8;i++){const a=i*Math.PI/4;add(new THREE.BoxGeometry(.12,.04,.4),gold,.68,Math.cos(a)*1.7,Math.sin(a)*1.7).rotation.y=-a}
const coreMat=new THREE.MeshStandardMaterial({color:0x2a2a3a,emissive:0xffc860,emissiveIntensity:0,roughness:.3});
const core=add(new THREE.SphereGeometry(.5,16,12),coreMat,1.9);
const ring=add(new THREE.TorusGeometry(.8,.04,6,32),gold,1.9);ring.rotation.x=1.2;
const shock=new THREE.Mesh(new THREE.RingGeometry(.9,1,48),new THREE.MeshBasicMaterial({color:0xffd070,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));shock.rotation.x=-Math.PI/2;shock.position.set(0,.08,-9);scene.add(shock);

/* clouds */
const cloudM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.92}),cloudG=new THREE.SphereGeometry(1,8,6);
const clouds=[];
for(let i=0;i<14;i++){const g=new THREE.Group(),n=4+(i%3);for(let j=0;j<n;j++){const m=new THREE.Mesh(cloudG,cloudM);m.position.set(j*2.2-n,rr(-.4,.5),rr(-1,1));m.scale.set(rr(2,3.2),rr(1.2,1.9),rr(1.5,2.4));g.add(m)}
const a=rr(0,6.283),r=i<10?rr(28,70):rr(60,90);g.position.set(Math.cos(a)*r,i<10?rr(-14,4):rr(18,32),Math.sin(a)*r);g.userData.v=rr(.25,.7);scene.add(g);clouds.push(g)}

/* fireflies */
const FN=70,ffBase=new Float32Array(FN*3),ffPos=new Float32Array(FN*3);
for(let i=0;i<FN;i++){const[x,z]=ringPos(0,12,false);ffBase.set([x,rr(.6,3),z],i*3)}
const ffG=new THREE.BufferGeometry();ffG.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const ff=new THREE.Points(ffG,new THREE.PointsMaterial({size:.35,map:glowTex,color:0xfff0a8,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));ff.frustumCulled=false;scene.add(ff);

/* ---------- particles ---------- */
class FX{constructor(n,size,grav){this.n=n;this.i=0;this.g=grav;this.p=new Float32Array(n*3).fill(9999);this.c=new Float32Array(n*3);this.b=new Float32Array(n*3);this.v=new Float32Array(n*3);this.l=new Float32Array(n);this.m=new Float32Array(n).fill(1);
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(this.p,3));g.setAttribute('color',new THREE.BufferAttribute(this.c,3));this.geo=g;
this.pts=new THREE.Points(g,new THREE.PointsMaterial({size,map:glowTex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));this.pts.frustumCulled=false;scene.add(this.pts)}
emit(x,y,z,vx,vy,vz,life,col){const i=this.i;this.i=(i+1)%this.n;const k=i*3;this.p[k]=x;this.p[k+1]=y;this.p[k+2]=z;this.v[k]=vx;this.v[k+1]=vy;this.v[k+2]=vz;this.l[i]=this.m[i]=life;tmpA.set(col);this.b[k]=tmpA.r;this.b[k+1]=tmpA.g;this.b[k+2]=tmpA.b}
burst(x,y,z,n,sp,life,pal){for(let j=0;j<n;j++){const u=rr(0,6.283),v=rr(-1,1),r=Math.sqrt(1-v*v),s=sp*rr(.6,1);this.emit(x,y,z,Math.cos(u)*r*s,v*s,Math.sin(u)*r*s,life*rr(.7,1.1),pal[j%pal.length])}}
update(dt){for(let i=0;i<this.n;i++){const k=i*3;if(this.l[i]>0){this.l[i]-=dt;const f=Math.max(0,this.l[i]/this.m[i]);this.v[k+1]-=this.g*dt;this.p[k]+=this.v[k]*dt;this.p[k+1]+=this.v[k+1]*dt;this.p[k+2]+=this.v[k+2]*dt;this.c[k]=this.b[k]*f;this.c[k+1]=this.b[k+1]*f;this.c[k+2]=this.b[k+2]*f}else if(this.c[k]+this.c[k+1]+this.c[k+2]>0){this.c[k]=this.c[k+1]=this.c[k+2]=0}}
this.geo.attributes.position.needsUpdate=true;this.geo.attributes.color.needsUpdate=true}
clear(){this.l.fill(0);this.c.fill(0)}}
const fxN=new FX(260,.3,-1.5),fxF=new FX(900,1.6,5);
const FWP=[0xffe9a8,0xffffff,0xb98cff,0x8fc4ff,0xffc4e6];

/* ---------- player ---------- */
const player=new THREE.Group();scene.add(player);
const capeM=new THREE.MeshLambertMaterial({color:0x6f8cff,side:THREE.DoubleSide}),trimM=L(0xfff0c0),faceM=new THREE.MeshBasicMaterial({color:0x14122e}),eyeM=new THREE.MeshBasicMaterial({color:0xfff2b0});
const rig=new THREE.Group();player.add(rig);
const cape=new THREE.Mesh(new THREE.ConeGeometry(.42,.95,14,1,true),capeM);cape.position.set(0,.62,-.02);rig.add(cape);
const hem=new THREE.Mesh(new THREE.TorusGeometry(.4,.025,5,16),trimM);hem.rotation.x=Math.PI/2;hem.position.set(0,.15,-.02);rig.add(hem);
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.2,.28,.5,10),L(0xfff6e0));torso.position.y=.55;rig.add(torso);
const head=new THREE.Group();head.position.y=1.08;rig.add(head);
const hood=new THREE.Mesh(new THREE.SphereGeometry(.28,14,10),capeM);head.add(hood);
const tip=new THREE.Mesh(new THREE.ConeGeometry(.16,.3,8),capeM);tip.position.set(0,.22,-.18);tip.rotation.x=-.8;head.add(tip);
const face=new THREE.Mesh(new THREE.SphereGeometry(.19,12,8),faceM);face.position.set(0,-.01,.14);head.add(face);
[-.07,.07].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.03,6,5),eyeM);e.position.set(x,.02,.31);head.add(e)});
const legs=[-.1,.1].map(x=>{const g=new THREE.Group();g.position.set(x,.3,0);const m=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,.3,6),L(0xfff6e0));m.position.y=-.12;g.add(m);rig.add(g);return g});
const chest=new THREE.Mesh(new THREE.SphereGeometry(.08,8,6),new THREE.MeshBasicMaterial({color:0xffe9a0}));chest.position.set(0,.72,.25);rig.add(chest);
const chestGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffe9a0,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));chestGlow.scale.setScalar(.8);chestGlow.position.copy(chest.position);rig.add(chestGlow);
const pLight=new THREE.PointLight(0xffe6a0,2.5,6,2);pLight.position.set(0,1,.3);rig.add(pLight);
rig.scale.setScalar(1.3);
const blob=new THREE.Mesh(new THREE.CircleGeometry(.4,14),new THREE.MeshBasicMaterial({color:0x1a3a20,transparent:true,opacity:.25,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.02;player.add(blob);

/* ---------- constelação ---------- */
const HM=140,hPts=new Float32Array((HM+1)*3);
const hx=t=>16*Math.pow(Math.sin(t),3),hy=t=>13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+2.5;
for(let i=0;i<=HM;i++){const t=i/HM*6.2832;hPts.set([hx(t),hy(t),0],i*3)}
const heart=new THREE.Group();heart.position.set(0,26,-45);scene.add(heart);
const hGeo=new THREE.BufferGeometry();hGeo.setAttribute('position',new THREE.BufferAttribute(hPts,3));
const hLine=new THREE.Line(hGeo,new THREE.LineBasicMaterial({color:0xffe9a8,transparent:true,opacity:.75,fog:false,depthWrite:false}));hLine.frustumCulled=false;heart.add(hLine);
const hDots=new THREE.Points(hGeo,new THREE.PointsMaterial({size:1.1,map:glowTex,color:0xffd98a,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));hDots.frustumCulled=false;heart.add(hDots);
const sT=[.9,1.5708,3.1416,4.7124,5.3832],sTime=[5.5,7,8.5,10,11.5];
const sIdx=sT.map(t=>Math.round(t/6.2832*HM)),wp=[0,...sIdx,HM],segS=[...sTime,sTime[4]+1.4];
const stars=sT.map(t=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:starTex,color:0xfff2c0,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));s.position.set(hx(t),hy(t),0);s.visible=false;heart.add(s);return s});
const burstDone=[0,0,0,0,0],NOTES=[659,784,880,988,1175];

/* ---------- áudio ---------- */
let ac=null,soundOn=true;
function ensureAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
function tone(f,d=0,dur=1.4,v=.07,type='sine'){if(!ac||!soundOn)return;try{const t=ac.currentTime+d,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}
$('snd').addEventListener('click',()=>{ensureAudio();soundOn=!soundOn;$('snd').textContent=soundOn?'🔊':'🔇'});

/* ---------- estado ---------- */
let state='LOADING',time=0,yaw=0,pitch=.42,actT=0,altarGlow=0,nearAltar=false,walk=0,hintT=0,fwT=0,msgN=0;
const camPos=new THREE.Vector3(0,10,30),camLook=new THREE.Vector3(0,1,0),P0=new THREE.Vector3(),L0=new THREE.Vector3(),P1=new THREE.Vector3(0,10,32),L1=new THREE.Vector3(0,15,-45);
const cut={t:0};
const dbg=document.body;
function setState(s){state=s;dbg.dataset.s=s;jid=null;jx=jy=0;$('knob').style.transform='';cid=null}
let jid=null,jx=0,jy=0,cid=null,cx=0,cy=0;

/* joystick */
const joy=$('joy');
function moveJoy(e){const r=joy.getBoundingClientRect(),R=r.width*.38;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l}$('knob').style.transform=`translate(${dx}px,${dy}px)`;jx=dx/R;jy=-dy/R}
joy.addEventListener('pointerdown',e=>{if(jid!==null||state!=='EXPLORATION')return;jid=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(_){}moveJoy(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)moveJoy(e)});
const endJoy=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;$('knob').style.transform=''};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>joy.addEventListener(n,endJoy));
/* câmera */
const cz=$('cam');
cz.addEventListener('pointerdown',e=>{if(cid!==null||state!=='EXPLORATION')return;cid=e.pointerId;cx=e.clientX;cy=e.clientY;try{cz.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
cz.addEventListener('pointermove',e=>{if(e.pointerId!==cid)return;yaw-=(e.clientX-cx)*.0055;pitch=clamp(pitch+(e.clientY-cy)*.004,.12,1.15);cx=e.clientX;cy=e.clientY});
const endCam=e=>{if(e.pointerId===cid)cid=null};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cz.addEventListener(n,endCam));
/* teclado */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;if((e.code==='KeyE'||e.code==='Enter')&&state==='EXPLORATION'&&nearAltar){e.preventDefault();activate()}});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});

/* ---------- fluxo ---------- */
function reset(){
player.position.set(0,0,8);player.rotation.y=Math.PI;yaw=0;pitch=.42;altarGlow=0;actT=0;cut.t=0;msgN=0;fwT=0;burstDone.fill(0);hintT=0;
stars.forEach(s=>s.visible=false);hGeo.setDrawRange(0,0);fxN.clear();fxF.clear();shock.material.opacity=0;
['m1','m2','m3','again'].forEach(i=>$(i).classList.remove('show'));$('act').classList.remove('show');$('hint').classList.remove('off');
heart.scale.setScalar(1)}
function activate(){if(state!=='EXPLORATION'||!nearAltar)return;setState('ACT');actT=0;$('act').classList.remove('show');[523,659,784,1047].forEach((f,i)=>tone(f,i*.35,2.2,.06))}
function startCut(){P0.copy(camPos);L0.copy(camLook);cut.t=0;setState('CUTSCENE')}
$('start').addEventListener('click',()=>{ensureAudio();tone(784,0,1.2,.05);tone(1175,.15,1.4,.04);reset();setState('EXPLORATION')});
$('act').addEventListener('click',activate);
$('skip').addEventListener('click',()=>{if(state==='CUTSCENE')cut.t=Math.max(cut.t,26)});
$('again').addEventListener('click',()=>{if(state!=='FINALE'||cut.t<24.5)return;reset();setState('EXPLORATION')});

/* ---------- update ---------- */
const f2=new THREE.Vector3(),tgt=new THREE.Vector3(),want=new THREE.Vector3();
function update(dt){
const night=state==='CUTSCENE'||state==='FINALE'?sm(cut.t/9):0;
/* ambiente */
clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>95)c.position.x=-95});
pebbles.forEach(p=>{const u=p.userData;u.a+=dt*.05;p.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(time+u.a*5)*.4,Math.sin(u.a)*u.r);p.rotation.y+=dt*.2;p.scale.setScalar(u.s*4)});
pathLights.forEach((l,i)=>l.scale.setScalar(1+.35*Math.sin(time*3+i*.7)));
for(let i=0;i<FN;i++){const k=i*3;ffPos[k]=ffBase[k]+Math.sin(time*.6+i)*.5;ffPos[k+1]=ffBase[k+1]+Math.sin(time*.9+i*1.7)*.35;ffPos[k+2]=ffBase[k+2]+Math.cos(time*.5+i*.8)*.5}
ffG.attributes.position.needsUpdate=true;ff.material.opacity=1-night*.2;
ring.rotation.z+=dt*.8;
/* jogador */
let moving=false,mag=0;
if(state==='EXPLORATION'){
let ix=jx+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),iy=jy+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
mag=Math.min(1,Math.hypot(ix,iy));if(mag<.12)mag=0;
if(mag>0){const l=Math.hypot(ix,iy);ix/=l;iy/=l;const s=Math.sin(yaw),c=Math.cos(yaw);
const dx=-s*iy+c*ix,dz=-c*iy-s*ix,sp=4.2*mag;player.position.x+=dx*sp*dt;player.position.z+=dz*sp*dt;moving=true;
let d=Math.atan2(dx,dz)-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*(1-Math.exp(-dt*12));walk+=dt*9*mag}
for(const[x,z,r]of cols){const ddx=player.position.x-x,ddz=player.position.z-z,d=Math.hypot(ddx,ddz);if(d<r+.3&&d>0){player.position.x=x+ddx/d*(r+.3);player.position.z=z+ddz/d*(r+.3)}}
const pr2=Math.hypot(player.position.x,player.position.z);if(pr2>11.8){player.position.x*=11.8/pr2;player.position.z*=11.8/pr2}
nearAltar=Math.hypot(player.position.x,player.position.z+9)<3.6;
$('act').classList.toggle('show',nearAltar);
hintT+=dt;$('hint').classList.toggle('off',nearAltar||hintT>12);
}else nearAltar=false;
if(state==='ACT'||state==='CUTSCENE'||state==='FINALE'){let d=Math.atan2(0-player.position.x,-9-player.position.z)-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*(1-Math.exp(-dt*3))}
const wk=moving?Math.sin(walk):0;
legs[0].rotation.x=wk*.7;legs[1].rotation.x=-wk*.7;
rig.position.y=moving?Math.abs(Math.sin(walk))*.07:Math.sin(time*1.8)*.02;
cape.rotation.x=moving?.25+Math.sin(walk*.5)*.08:Math.sin(time*1.4)*.04;cape.rotation.z=Math.sin(time*1.1)*.04;
head.rotation.y=Math.sin(time*.7)*.1;
chestGlow.material.opacity=.7+.3*Math.sin(time*3);
/* altar ativação */
if(state==='ACT'){actT+=dt;const g=sm(actT/3.8);altarGlow=g;
const e=sm(actT/3.8);shock.scale.setScalar(1+e*14);shock.material.opacity=(1-e)*.9*Math.min(1,actT);
const n=Math.ceil(70*g*dt*60/60);for(let i=0;i<n;i++)fxN.emit(rr(-.3,.3),2,-9+rr(-.3,.3),rr(-.8,.8),rr(1.5,4),rr(-.8,.8),rr(1.5,2.5),FWP[i%5]);
if(actT>=4.6){startCut()}}
if(state==='CUTSCENE'||state==='FINALE'){altarGlow=1;if(!moving)cut.t+=dt}
coreMat.emissiveIntensity=altarGlow*2.6+(altarGlow>0?Math.sin(time*3)*.3:0);
altarLight.intensity=altarGlow*(45+Math.sin(time*3)*4);
gold.emissiveIntensity=.5+altarGlow*1.2;
if(altarGlow>.99&&state!=='ACT'&&Math.random()<dt*14)fxN.emit(rr(-.3,.3),2,-9,rr(-.5,.5),rr(1,2.5),rr(-.5,.5),2,0xffe9a8);
/* cutscene */
if(state==='CUTSCENE'||state==='FINALE'){
const t=cut.t,k=sm(t/9);
const asp=camera.aspect,s=Math.min(1.25,.78*89*asp/32);heart.scale.setScalar(s);
for(let i=0;i<5;i++){const st=stars[i],a=t-sTime[i];if(a>=0){st.visible=true;if(!burstDone[i]){burstDone[i]=1;st.getWorldPosition(want);fxF.burst(want.x,want.y,want.z,16,6,1.3,[0xffffff,0xffe9a8]);tone(NOTES[i],0,2.4,.07);tone(NOTES[i]*2,.05,1.6,.025)}
const ap=1-Math.pow(1-clamp(a/1.1),3),fl=Math.exp(-a*3.5)*2.5;st.material.opacity=clamp(a/.4);st.scale.setScalar((7+fl*5)*ap*(1+.08*Math.sin(time*3+i*1.3)))}}
let cnt=0;for(let q=5;q>=0;q--){if(t>=segS[q]){cnt=wp[q]+(wp[q+1]-wp[q])*sm((t-segS[q])/1.4);break}}
hGeo.setDrawRange(0,Math.floor(cnt)+1);
skyAt(k);hemi.intensity=lerp(1.5,.55,k)+altarGlow*.1;dir.intensity=lerp(2,.3,k);hemi.color.setHex(0xe4f3ff).lerp(tmpB.setHex(0x8a8cff),k);
cloudM.color.setHex(0xffffff).lerp(tmpB.setHex(0x4a4f95),k);bgStars.material.opacity=sm((t-4)/5)*.9;
pLight.intensity=2.5;
tgt.set(0,lerp(1.2,1.2,k),0).add(player.position);
want.copy(P0).lerp(P1,k);want.y+=Math.sin(k*Math.PI)*5;camPos.copy(want);camLook.copy(L0).lerp(L1,k);
if(t>=9&&camPos.distanceTo(P1)>.01)camPos.copy(P1);
if(t>=13&&(fwT-=dt)<=0){fwT=t>=14?rr(.9,1.6):.5;const sd=Math.random()<.5?-1:1,x=sd*rr(16,38),y=rr(10,40);fxF.burst(x,y,-62,38,15,1.8,[FWP[(Math.random()*5)|0],FWP[(Math.random()*5)|0],0xffffff]);tone(rr(110,180),0,.3,.03,'triangle')}
if(t>=14&&state==='CUTSCENE')setState('FINALE');
const times=[14.5,18,21.5];for(let i=0;i<3;i++)if(t>=times[i]&&msgN===i){msgN++;$('m'+(i+1)).classList.add('show');if(i===1)[880,1175,1568].forEach((f,j)=>tone(f,j*.12,1.8,.05))}
if(t>=24.5)$('again').classList.add('show');
}else{
skyAt(0);hemi.intensity=1.5;dir.intensity=2;hemi.color.setHex(0xe4f3ff);cloudM.color.setHex(0xffffff);bgStars.material.opacity=0;
if(state==='ACT')hemi.intensity=1.5+altarGlow*.4;
/* câmera */
if(state==='EXPLORATION'||state==='ACT'){
tgt.set(player.position.x,1.3,player.position.z);const cp=Math.cos(pitch),dist=state==='ACT'?7+actT*.5:7;
want.set(tgt.x+Math.sin(yaw)*cp*dist,Math.max(.8,tgt.y+Math.sin(pitch)*dist),tgt.z+Math.cos(yaw)*cp*dist);
const q=1-Math.exp(-dt*(state==='EXPLORATION'?7:3));camPos.lerp(want,q);camLook.lerp(tgt,q*1.2>1?1:q*1.2+.05>1?1:q*1.2+.05)}
else{const a=time*.1;want.set(Math.sin(a)*24,9,Math.cos(a)*24-2);camPos.lerp(want,1-Math.exp(-dt*2));tgt.set(0,2,-2);camLook.lerp(tgt,1-Math.exp(-dt*2))}
}
camera.position.copy(camPos);camera.lookAt(camLook);sky.position.copy(camera.position);
fxN.update(dt);fxF.update(dt);
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0,fr=0;
function loop(now){requestAnimationFrame(loop);if(ctxLost){last=now;return}
let dt=(now-last)/1000;last=now;if(!(dt>0))dt=.016;dt=Math.min(dt,.05);time+=dt;
update(dt);renderer.render(scene,camera);
acc+=dt;if(++fr>=90){if(acc/fr>.026&&pr>.75){pr=Math.max(.75,pr-.2);resize()}acc=0;fr=0}}
document.addEventListener('visibilitychange',()=>{last=performance.now();if(ac){document.hidden?ac.suspend().catch(()=>{}):(soundOn&&ac.resume().catch(()=>{}))}});
resize();reset();skyAt(0);setState('MENU');
requestAnimationFrame(t=>{last=t;loop(t)});
window.__ready=true;
</script>
</body>
</html>
